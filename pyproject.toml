[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salt"
version = "0.1.0"
description = "SALT: Salience-Aware Lexical Trie for Long-Context Compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers==4.55.2",
    "accelerate>=1.0",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "huggingface_hub",
    "datasets==3.6.0",
    "click",
    "rouge>=1.0",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.25",
    "jieba>=0.42",
]

[project.scripts]
salt = "salt.compress:main"
saltChat = "salt.chat.cli:main"

[tool.setuptools.packages.find]
include = ["salt", "salt.engine", "salt.datasets", "salt.results", "salt.chat"]
namespaces = false
