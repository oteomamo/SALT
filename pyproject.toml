[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "salt"
version = "2.10.115"
description = "SALT: Salience-Aware Lexical Trie for Long-Context Compression"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers==4.55.2",
    "accelerate>=1.0",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "huggingface_hub",
    "pypdf>=4.0",
    "datasets==3.6.0",
    "requests>=2.31",
    "rouge>=1.0",
    "fuzzywuzzy>=0.18",
    "python-Levenshtein>=0.25",
]

[project.optional-dependencies]
vllm = ["vllm==0.11.0", "prometheus-fastapi-instrumentator>=8.0.1"]
mcp = ["mcp>=1.0"]
docs = ["mkdocs-material>=9", "mike>=2"]

[project.scripts]
salt = "salt.compress:main"
saltChat = "salt.chat.cli:main"
saltServe = "salt.chat.serve:main"
salt-mcp = "salt.mcp.server:main"

[tool.setuptools.packages.find]
include = ["salt", "salt.engine", "salt.datasets", "salt.results", "salt.chat", "salt.agents", "salt.mcp"]
namespaces = false

[tool.setuptools.package-data]
"salt.chat" = ["instructions.md"]
"salt.agents" = ["roster_sample.json", "demo_turns.json",
                 "worker_instructions.md", "orchestrator_schema.md",
                 "orchestrator_plain.md", "synthesis.md",
                 "switch_rules_sample.json", "demo_site_notes.txt"]
