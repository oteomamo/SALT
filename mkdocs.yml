site_name: SALT
site_description: Salience-Aware Lexical Trie for Long-Context Compression
site_url: https://oteomamo.github.io/SALT/
repo_url: https://github.com/oteomamo/SALT
repo_name: oteomamo/SALT

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/versions.js

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Usage: usage.md
  - Guides:
      - Chatbot mode: chatbot.md
      - Serving: serving.md
      - Agents: agents.md
      - MCP server: mcp.md
      - Options: options.md
  - Concepts:
      - Architecture: architecture.md
  - Evaluation:
      - Datasets: datasets.md
      - Results: results.md
  - Project:
      - Paper: paper.md
      - Changelog: changelog.md
      - Roadmap: roadmap.md
